        function setLanguage(lang) {
            currentLanguage = lang;
            
            // Update language buttons
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            // Update header
            document.getElementById('headerTitle').textContent = translations[lang].headerTitle;
            document.getElementById('headerSubtitle').textContent = translations[lang].headerSubtitle;
            
            // Update tabs
            const tabs = document.querySelectorAll('.tab');
            tabs.forEach((tab, index) => {
                tab.textContent = translations[lang].tabNames[index];
            });
            
            // Update footer
            document.getElementById('footer').textContent = translations[lang].footer;
            
            // Update tab contents (simplified for demo)
            renderTab0();
        }

        function switchTab(tabIndex) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));

            document.querySelectorAll('.tab')[tabIndex].classList.add('active');

            window.scrollTo(0, 0);
